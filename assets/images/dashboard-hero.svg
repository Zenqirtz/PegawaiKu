<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Background Shapes -->
  <rect x="10" y="8" width="340" height="124" rx="16" fill="url(#bgGlow)"/>
  <circle cx="320" cy="24" r="28" fill="#bfdbfe" fill-opacity="0.35"/>
  <circle cx="35" cy="115" r="20" fill="#93c5fd" fill-opacity="0.25"/>

  <!-- Left Mini Card: Quick Metric -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="24" width="95" height="92" rx="10" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Icon Circle -->
    <circle cx="48" cy="46" r="14" fill="#eff6ff"/>
    <path d="M43 46a5 5 0 1 0 10 0 5 5 0 0 0-10 0zm-2 10a7 7 0 0 1 14 0h-14z" fill="#2563eb"/>
    <!-- Bar Stats -->
    <rect x="70" y="38" width="38" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="70" y="48" width="24" height="5" rx="2.5" fill="#93c5fd"/>
    <!-- Chart Bars -->
    <rect x="36" y="84" width="8" height="20" rx="3" fill="#93c5fd"/>
    <rect x="48" y="74" width="8" height="30" rx="3" fill="#60a5fa"/>
    <rect x="60" y="66" width="8" height="38" rx="3" fill="#3b82f6"/>
    <rect x="72" y="70" width="8" height="34" rx="3" fill="#2563eb"/>
    <rect x="84" y="60" width="8" height="44" rx="3" fill="url(#blueGrad)"/>
    <rect x="96" y="78" width="8" height="26" rx="3" fill="#bfdbfe"/>
  </g>

  <!-- Center Card: Digital ID Badge -->
  <g filter="url(#cardShadow)">
    <rect x="135" y="16" width="125" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Badge Header Color Strip -->
    <rect x="135" y="16" width="125" height="8" rx="4" fill="url(#blueGrad)"/>
    <!-- Avatar -->
    <circle cx="197" cy="46" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <!-- Avatar Person Head & Body -->
    <circle cx="197" cy="42" r="6" fill="#2563eb"/>
    <path d="M187 56c0-4 4.5-6.5 10-6.5s10 2.5 10 6.5v1h-20v-1z" fill="#2563eb"/>
    <!-- Verified Badge -->
    <circle cx="211" cy="54" r="6" fill="#10b981"/>
    <path d="M208.5 54l2 2 3.5-3.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Name and Title Lines -->
    <rect x="160" y="70" width="75" height="6" rx="3" fill="#0f172a"/>
    <rect x="170" y="80" width="55" height="5" rx="2.5" fill="#64748b"/>
    <!-- Monospace NIP pill -->
    <rect x="150" y="93" width="95" height="16" rx="8" fill="#f1f5f9"/>
    <text x="197" y="104.5" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#334155" letter-spacing="0.5">18 DIGIT NIP</text>
  </g>

  <!-- Right Floating Metric: Performance / Accuracy -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="32" width="72" height="78" rx="10" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Circular Ring Progress -->
    <circle cx="306" cy="62" r="20" stroke="#e2e8f0" stroke-width="4.5" fill="none"/>
    <circle cx="306" cy="62" r="20" stroke="url(#tealGrad)" stroke-width="4.5" stroke-dasharray="125.6" stroke-dashoffset="31.4" stroke-linecap="round" fill="none" transform="rotate(-90 306 62)"/>
    <text x="306" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">100%</text>
    <rect x="278" y="90" width="56" height="4" rx="2" fill="#94a3b8"/>
    <rect x="286" y="97" width="40" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Decorative sparkles -->
  <path d="M125 18l1.5 3.5L130 23l-3.5 1.5L125 28l-1.5-3.5L120 23l3.5-1.5z" fill="#f59e0b"/>
  <circle cx="264" cy="22" r="2" fill="#3b82f6"/>
  <circle cx="120" cy="118" r="2.5" fill="#10b981"/>
</svg>
